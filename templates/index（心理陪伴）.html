<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聆心小开 - 倾诉空间 (全屏版)</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    :root {
      --bg-start: #EBF2ED;
      --bg-end: #F8FBF9;
      --text-main: #3A4A41;
      --text-sub: #7A8F83;
      --accent-color: #7DA48D;
      --accent-hover: #658A74;
      --accent-light: #DCE8E1;
      --glass-bg: rgba(255, 255, 255, 0.55);
      --glass-border: rgba(255, 255, 255, 0.8);
      --shadow: rgba(74, 93, 82, 0.06);
    }

    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
      font-family: 'PingFang SC', 'Noto Sans SC', -apple-system, sans-serif;
      color: var(--text-main);
      background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
    }

    #canvas-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
    }

    .app-layout {
      position: relative; z-index: 10;
      display: flex; width: 100%; height: 100%;
      background: transparent;
    }

    .sidebar {
      width: 260px; height: 100%;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border-right: 1px solid var(--glass-border);
      display: flex; flex-direction: column;
      padding: 24px 16px;
      box-shadow: 4px 0 24px rgba(0,0,0,0.02);
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .sidebar-brand {
      display: flex; align-items: center; gap: 12px;
      padding: 0 10px 24px 10px;
    }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
      color: white; display: flex; align-items: center; justify-content: center;
      font-size: 18px; box-shadow: 0 4px 12px rgba(125,164,141,0.4);
    }
    .brand-text { font-size: 18px; font-weight: 600; letter-spacing: 1px; color: var(--text-main); }

    .nav-title {
      font-size: 12px; color: var(--text-sub); margin: 10px 10px; font-weight: 500;
      letter-spacing: 1px; text-transform: uppercase;
    }

    .nav-menu { display: flex; flex-direction: column; gap: 8px; }

    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-radius: 16px; cursor: pointer;
      color: var(--text-main); text-decoration: none; font-size: 15px; font-weight: 500;
      transition: all 0.3s ease; border: 1px solid transparent;
      background: none; width: 100%; text-align: left; font-family: inherit;
      -webkit-tap-highlight-color: rgba(125,164,141,0.2);
    }
    .nav-item i { font-size: 16px; width: 20px; text-align: center; color: var(--text-sub); transition: 0.3s; }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.7);
      border-color: var(--glass-border);
      transform: translateX(4px); box-shadow: 0 4px 12px var(--shadow);
    }
    .nav-item:hover i { color: var(--accent-color); }

    .nav-item.active {
      background: rgba(255, 255, 255, 0.9);
      color: var(--accent-color);
      border-color: var(--glass-border);
      box-shadow: 0 6px 16px rgba(125,164,141,0.15);
    }
    .nav-item.active i { color: var(--accent-color); }

    .user-profile {
      margin-top: auto; display: flex; align-items: center; gap: 12px;
      padding: 12px; background: rgba(255,255,255,0.5); border-radius: 16px;
      border: 1px solid var(--glass-border); cursor: pointer; transition: 0.3s;
    }
    .user-profile:hover { background: rgba(255,255,255,0.8); box-shadow: 0 4px 12px var(--shadow); }
    .user-avatar { width: 36px; height: 36px; border-radius: 10px; background: var(--accent-light); overflow: hidden; flex-shrink: 0; }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-status { font-size: 11px; color: var(--text-sub); display: flex; align-items: center; gap: 4px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #E57373; }

    .chat-main {
      flex: 1; height: 100%; display: flex; flex-direction: column;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      position: relative; min-width: 0;
    }

    .top-header {
      height: 64px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; border-bottom: 1px solid rgba(255,255,255,0.4);
      background: linear-gradient(to bottom, rgba(255,255,255,0.5) 0%, transparent 100%);
    }
    .header-title { font-size: 16px; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .header-actions button {
      background: rgba(255,255,255,0.6); border: 1px solid var(--glass-border);
      width: 36px; height: 36px; border-radius: 50%; color: var(--text-sub);
      cursor: pointer; transition: 0.3s; box-shadow: 0 2px 8px var(--shadow);
    }
    .header-actions button:hover { background: #fff; color: var(--accent-color); transform: translateY(-2px); }

    .chat-area {
      flex: 1; overflow-y: auto; padding: 30px 12%;
      scroll-behavior: smooth;
    }
    .chat-area::-webkit-scrollbar { width: 6px; }
    .chat-area::-webkit-scrollbar-thumb { background: rgba(125,164,141,0.25); border-radius: 3px; }

    .msg { display: flex; margin-bottom: 28px; align-items: flex-end; animation: msgIn 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); }
    @keyframes msgIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .msg.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 40px; height: 40px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 18px; margin: 0 16px;
      box-shadow: 0 4px 15px var(--shadow); border: 2px solid #fff;
    }
    .msg.assistant .msg-avatar { background: rgba(255,255,255,0.9); color: #C75C7A; }
    .msg.user .msg-avatar { background: linear-gradient(135deg, var(--accent-hover), var(--accent-color)); color: #fff; }

    .msg-content-wrap { display: flex; flex-direction: column; max-width: 75%; }
    .msg.user .msg-content-wrap { align-items: flex-end; }
    .msg.assistant .msg-content-wrap { align-items: flex-start; }

    .msg-body {
      padding: 16px 22px; font-size: 15px; line-height: 1.6; word-wrap: break-word;
      transition: transform 0.2s ease;
    }
    .msg-body:hover { transform: translateY(-2px); }

    .msg.user .msg-body {
      background: linear-gradient(135deg, var(--accent-hover), var(--accent-color));
      color: #fff; border-radius: 20px 20px 4px 20px;
      box-shadow: 0 8px 25px rgba(125, 164, 141, 0.25);
    }
    .msg.assistant .msg-body {
      background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      color: var(--text-main); border-radius: 20px 20px 20px 4px;
      border: 1px solid var(--glass-border); box-shadow: 0 8px 30px var(--shadow);
    }

    .msg-body p { margin: 0 0 10px 0; }
    .msg-body p:last-child { margin: 0; }
    .msg.assistant .msg-body strong { color: #2A3830; }

    .msg-time { font-size: 11px; color: var(--text-sub); margin-top: 6px; padding: 0 4px; }

    .input-wrap {
      flex-shrink: 0; padding: 20px 10%;
      background: linear-gradient(to top, rgba(235,242,237,0.9) 0%, transparent 100%);
      z-index: 20;
    }
    .input-row {
      display: flex; gap: 12px; align-items: center;
      background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(25px);
      padding: 10px 12px 10px 24px; border-radius: 30px;
      box-shadow: 0 10px 30px var(--shadow); border: 1px solid var(--glass-border);
      transition: all 0.3s ease;
    }
    .input-row:focus-within { background: #fff; box-shadow: 0 15px 40px rgba(125, 164, 141, 0.15); border-color: var(--accent-color); }

    .input-row input {
      flex: 1; border: none; padding: 12px 0; font-size: 15px;
      background: transparent; outline: none; color: var(--text-main);
    }
    .input-row input::placeholder { color: #a6b3ac; }

    .input-row button {
      width: 48px; height: 48px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, var(--accent-hover), var(--accent-color));
      color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 18px; box-shadow: 0 4px 15px rgba(125,164,141,0.3); transition: all 0.3s ease; flex-shrink: 0;
    }
    .input-row button:hover:not(:disabled) { transform: translateY(-2px) scale(1.05); box-shadow: 0 8px 20px rgba(125,164,141,0.4); }
    .input-row button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .menu-toggle { display: none; background: none; border: none; font-size: 20px; color: var(--text-main); cursor: pointer; }

    .sidebar-backdrop {
      display: none; position: fixed; inset: 0; z-index: 100; background: rgba(58,74,65,0.2);
    }
    .sidebar-backdrop.show { display: block; }
    @media (max-width: 768px) {
      .sidebar-backdrop.show { left: 260px; }
    }

    .modal {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(58,74,65,0.28); backdrop-filter: blur(8px);
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal.show { display: flex; }
    .modal-box {
      background: var(--glass-bg); backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border); border-radius: 24px;
      padding: 24px; max-width: 440px; width: 100%; max-height: 85vh; overflow-y: auto;
      box-shadow: 0 24px 60px var(--shadow);
    }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-head h2 { margin: 0; font-size: 1.1rem; color: var(--text-main); }
    .modal-close {
      border: none; background: rgba(255,255,255,0.6); width: 36px; height: 36px; border-radius: 50%;
      cursor: pointer; color: var(--text-sub); font-size: 1.2rem;
    }
    .modal-close:hover { color: var(--accent-color); background: #fff; }

    #radarChart { width: 100%; height: 280px; }
    .modal-tip { font-size: 0.88rem; color: var(--text-sub); margin-top: 12px; line-height: 1.5; }

    .diary-textarea {
      width: 100%; min-height: 140px; padding: 14px; border-radius: 16px;
      border: 1px solid var(--glass-border); font-family: inherit; font-size: 0.95rem;
      resize: vertical; background: rgba(255,255,255,0.7);
    }
    .diary-textarea:focus { outline: none; border-color: var(--accent-color); }
    .btn-primary {
      margin-top: 14px; padding: 12px 22px; border-radius: 22px; border: none;
      background: linear-gradient(135deg, var(--accent-hover), var(--accent-color));
      color: #fff; font-size: 0.95rem; cursor: pointer; font-weight: 500;
      box-shadow: 0 4px 14px rgba(125,164,141,0.3);
    }
    .btn-primary:hover { transform: translateY(-1px); }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      text-align: center;
    }
    .cal-day {
      padding: 14px 8px;
      border-radius: 14px;
      background: rgba(255,255,255,0.55);
      font-size: 0.85rem;
      border: 1px solid var(--glass-border);
    }
    .cal-day span { display: block; font-size: 0.72rem; color: var(--text-sub); margin-bottom: 4px; }

    @media (max-width: 900px) {
      .chat-area { padding: 20px 5%; }
      .input-wrap { padding: 15px 5%; }
    }

    @media (min-width: 769px) {
      .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 101; }
      .app-layout { margin-left: 260px; }
    }

    @media (max-width: 768px) {
      .menu-toggle { display: block; }
      .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 101; transform: translateX(-100%); touch-action: manipulation; }
      .sidebar.open { transform: translateX(0); }
      .nav-item { touch-action: manipulation; min-height: 44px; position: relative; z-index: 1; }
      .nav-item:hover { transform: none; }
      .msg-content-wrap { max-width: 85%; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon"><i class="fa-solid fa-heart"></i></div>
      <div class="brand-text">聆心小开</div>
    </div>

    <div class="nav-title">陪伴空间</div>
    <nav class="nav-menu" style="flex:1;">
      <button type="button" class="nav-item active" data-view="chat" id="navChat"><i class="fa-solid fa-comments"></i> 倾诉树洞</button>
      <button type="button" class="nav-item" data-action="emotion"><i class="fa-solid fa-chart-line"></i> 情绪分析</button>
      <button type="button" class="nav-item" data-action="diary"><i class="fa-solid fa-book"></i> 心理日记</button>
      <button type="button" class="nav-item" data-action="calendar"><i class="fa-solid fa-calendar"></i> 情绪日历</button>
      <a class="nav-item" href="/"><i class="fa-solid fa-house"></i> 返回首页</a>
      <button type="button" class="nav-item" id="btnLogout"><i class="fa-solid fa-right-from-bracket"></i> 退出登录</button>
    </nav>

    <div class="user-profile" id="userProfile" title="个人资料">
      <div class="user-avatar"><img id="userAvatarImg" src="https://api.dicebear.com/7.x/avataaars/svg?seed=heart" alt=""></div>
      <div class="user-info">
        <div class="user-name" id="userDisplayName">旅人</div>
        <div class="user-status"><span class="status-dot"></span> 正在倾听</div>
      </div>
    </div>
  </aside>

  <div class="app-layout">
    <main class="chat-main">
      <header class="top-header">
        <div class="header-title">
          <button type="button" class="menu-toggle" id="menuToggle" aria-label="菜单"><i class="fa-solid fa-bars"></i></button>
          <span>心理陪伴 · 倾诉空间</span>
        </div>
        <div class="header-actions">
          <button type="button" title="清空对话" id="btnClearChat"><i class="fa-solid fa-broom"></i></button>
        </div>
      </header>

      <div class="chat-area" id="chat"></div>

      <div class="input-wrap">
        <div class="input-row">
          <input type="text" id="input" placeholder="说说你想聊的，我在这里倾听..." autocomplete="off">
          <button id="send" type="button" disabled><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>
    </main>
  </div>

  <div class="modal" id="modalEmotion" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head">
        <h2>情绪分析</h2>
        <button type="button" class="modal-close" data-close="modalEmotion">&times;</button>
      </div>
      <div id="radarChart"></div>
      <p class="modal-tip" id="emotionTip"></p>
    </div>
  </div>

  <div class="modal" id="modalDiary" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head">
        <h2>心理日记</h2>
        <button type="button" class="modal-close" data-close="modalDiary">&times;</button>
      </div>
      <textarea class="diary-textarea" id="diaryText" placeholder="记录今日的心情与感悟..."></textarea>
      <button type="button" class="btn-primary" id="saveDiary">保存到本地</button>
    </div>
  </div>

  <div class="modal" id="modalCalendar" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head">
        <h2>情绪日历</h2>
        <button type="button" class="modal-close" data-close="modalCalendar">&times;</button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
      <p class="modal-tip">展示最近 7 天在本地记录的心情关键词（可在日记中多写「开心」「平静」等词，下次打开会更新示意）。</p>
    </div>
  </div>

  <script>
    let globalWindSpeed = 1.0;

    const initBackground = () => {
      const container = document.getElementById('canvas-container');
      if (typeof THREE === 'undefined') return;
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2('#EBF2ED', 0.006);

      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 60;

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      const createTexture = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 32; canvas.height = 32;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
        grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
        grad.addColorStop(0.4, 'rgba(255, 255, 255, 0.6)');
        grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(16, 16, 16, 0, Math.PI * 2); ctx.fill();
        return new THREE.CanvasTexture(canvas);
      };

      const particleCount = 450;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(particleCount * 3);
      const velocities = [];

      for (let i = 0; i < particleCount; i++) {
        pos[i * 3] = (Math.random() - 0.5) * 150;
        pos[i * 3 + 1] = (Math.random() - 0.5) * 100;
        pos[i * 3 + 2] = (Math.random() - 0.5) * 80;
        velocities.push({
          x: (Math.random() - 0.5) * 0.02,
          y: Math.random() * 0.03 + 0.01
        });
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

      const mat = new THREE.PointsMaterial({
        size: 1.2, color: 0x7DA48D, map: createTexture(),
        transparent: true, opacity: 0.6, depthWrite: false, blending: THREE.AdditiveBlending
      });
      scene.add(new THREE.Points(geo, mat));

      let targetRotX = 0, targetRotY = 0;
      document.addEventListener('mousemove', (e) => {
        targetRotY = ((e.clientX / window.innerWidth) * 2 - 1) * 0.05;
        targetRotX = ((e.clientY / window.innerHeight) * 2 - 1) * 0.05;
      });

      let time = 0;
      const animate = () => {
        requestAnimationFrame(animate);
        time += 0.002;
        camera.position.x += (targetRotY * 20 - camera.position.x) * 0.05;
        camera.position.y += (-targetRotX * 20 - camera.position.y) * 0.05;
        camera.lookAt(scene.position);

        const positions = geo.attributes.position.array;
        for (let i = 0; i < particleCount; i++) {
          const v = velocities[i];
          positions[i * 3] += v.x * globalWindSpeed + Math.sin(time * 3 + positions[i * 3 + 1] * 0.05) * 0.02 * globalWindSpeed;
          positions[i * 3 + 1] += v.y * globalWindSpeed;
          if (positions[i * 3 + 1] > 60) positions[i * 3 + 1] = -60;
        }
        geo.attributes.position.needsUpdate = true;
        if (globalWindSpeed > 1.0) globalWindSpeed += (1.0 - globalWindSpeed) * 0.02;
        renderer.render(scene, camera);
      };
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    };
    initBackground();

    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const SYS = `你是开开，像朋友一样陪聊：接住对方的情绪，轻轻呼应 TA 说的话，温暖、不评判。每次回复全文不超过50字；少讲理论、不重复大道理。若谈及自杀或自残，先表达关心并建议向身边人或专业援助求助。`;
    const MAX_HIST = 20;
    const LS_COMPANION_SID = 'lx_companion_session_id';
    let history = [];
    let currentSessionId = null;
    let radarChart = null;

    function newCompanionId() {
      return 'companion-' + (typeof crypto !== 'undefined' && crypto.randomUUID
        ? crypto.randomUUID()
        : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
    }

    function loadOrCreateSessionId() {
      let raw = localStorage.getItem(LS_COMPANION_SID);
      if (raw && raw.startsWith('companion-')) return raw;
      raw = newCompanionId();
      localStorage.setItem(LS_COMPANION_SID, raw);
      return raw;
    }

    async function hydrateCompanionHistory() {
      if (!currentSessionId) return;
      try {
        const r = await fetch('/api/users/me/messages?limit=2000', { credentials: 'include', cache: 'no-store' });
        if (!r.ok) return;
        const data = await r.json();
        const msgs = (data.messages || []).filter(
          m => m.session_id === currentSessionId && (m.role === 'user' || m.role === 'assistant')
        );
        msgs.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
        if (!msgs.length) return;
        history = msgs.map(m => ({ role: m.role, content: m.content }));
        chat.innerHTML = '';
        history.forEach(m => addMsg(m.content, m.role));
      } catch (_) {}
    }

    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    const sidebarBackdrop = document.getElementById('sidebarBackdrop');

    async function checkAuth() {
      const r = await fetch('/api/users/me', { credentials: 'include', cache: 'no-store' });
      if (!r.ok) { location.href = '/login'; return false; }
      try {
        const data = await r.json();
        const u = data.user || data;
        const name = u.nickname || u.username || u.name || '旅人';
        document.getElementById('userDisplayName').textContent = name;
        const seed = encodeURIComponent(String(u.id || name));
        document.getElementById('userAvatarImg').src = 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + seed;
      } catch (_) {}
      return true;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function md(s) {
      if (typeof marked !== 'undefined') {
        try { return marked.parse(s || ''); } catch (e) { return esc(s); }
      }
      return esc(s).replace(/\n/g, '<br>');
    }

    function getCurrentTime() {
      return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function appendAssistantMessage(htmlBody) {
      const row = document.createElement('div');
      row.className = 'msg assistant';
      row.innerHTML = `
        <div class="msg-avatar"><i class="fa-solid fa-heart"></i></div>
        <div class="msg-content-wrap">
          <div class="msg-body">${htmlBody}</div>
          <div class="msg-time">${getCurrentTime()}</div>
        </div>`;
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
      return row;
    }

    function addMsg(content, role) {
      const row = document.createElement('div');
      row.className = 'msg ' + role;
      row.innerHTML = `
        <div class="msg-avatar"><i class="fa-solid fa-${role === 'user' ? 'user' : 'heart'}"></i></div>
        <div class="msg-content-wrap">
          <div class="msg-body">${role === 'assistant' ? md(content) : esc(content).replace(/\n/g, '<br>')}</div>
          <div class="msg-time">${getCurrentTime()}</div>
        </div>`;
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    }

    function bumpWind() {
      globalWindSpeed = 8.0;
    }

    function pickApiError(data) {
      if (!data || typeof data !== 'object') return '';
      if (typeof data.message === 'string' && data.message) return data.message;
      const e = data.error;
      if (typeof e === 'string') return e;
      if (e && typeof e === 'object' && typeof e.message === 'string') return e.message;
      return '';
    }

    async function streamChat(text) {
      if (!(await checkAuth())) return;
      var t = text.trim();
      bumpWind();
      history.push({ role: 'user', content: text });
      addMsg(text, 'user');

      const body = document.createElement('div');
      body.className = 'msg-body';
      body.innerHTML = '<div class="typing" style="display:flex;gap:5px;padding:8px 0;"><span style="width:6px;height:6px;background:#7DA48D;border-radius:50%;animation:t1 1.4s infinite;"></span><span style="width:6px;height:6px;background:#7DA48D;border-radius:50%;animation:t1 1.4s infinite 0.2s;"></span><span style="width:6px;height:6px;background:#7DA48D;border-radius:50%;animation:t1 1.4s infinite 0.4s;"></span></div><style>@keyframes t1{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}</style>';
      const row = document.createElement('div');
      row.className = 'msg assistant';
      row.innerHTML = '<div class="msg-avatar"><i class="fa-solid fa-heart"></i></div><div class="msg-content-wrap"></div>';
      const wrap = row.querySelector('.msg-content-wrap');
      wrap.appendChild(body);
      const timeEl = document.createElement('div');
      timeEl.className = 'msg-time';
      timeEl.textContent = getCurrentTime();
      wrap.appendChild(timeEl);
      chat.appendChild(row);

      let full = '';
      try {
        const r = await fetch('/api/deepseek/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          cache: 'no-store',
          body: JSON.stringify({
            session_id: currentSessionId,
            messages: [{ role: 'system', content: SYS }, ...history.slice(-MAX_HIST)],
            max_tokens: 512,
            temperature: 0.7,
            stream: true
          })
        });
        if (r.status === 401) {
          const msg401 = '登录已过期，请重新登录后再试。';
          body.innerHTML = esc(msg401);
          history.push({ role: 'assistant', content: msg401 });
          setTimeout(() => { location.href = '/login'; }, 800);
          return;
        }
        if (!r.ok) {
          const errData = await r.json().catch(() => ({}));
          const msg = pickApiError(errData) || `请求失败（${r.status}）`;
          body.innerHTML = esc(msg);
          history.push({ role: 'assistant', content: msg });
          return;
        }
        const reader = r.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const lines = buf.split('\n');
          buf = lines.pop() || '';
          for (const line of lines) {
            if (line.startsWith('data: ') && line !== 'data: [DONE]') {
              try {
                const j = JSON.parse(line.slice(6));
                const d = j?.choices?.[0]?.delta;
                const piece = (d && (d.content || d.reasoning_content)) || '';
                if (piece) {
                  full += piece;
                  body.innerHTML = md(full);
                  timeEl.textContent = getCurrentTime();
                }
              } catch (_) {}
            }
          }
          chat.scrollTop = chat.scrollHeight;
        }
        body.innerHTML = md(full);
        timeEl.textContent = getCurrentTime();
        if (!full.trim()) {
          const err = '未收到模型回复，请检查接口配置或稍后再试。';
          body.innerHTML = esc(err);
          history.push({ role: 'assistant', content: err });
        } else {
          history.push({ role: 'assistant', content: full });
          try {
            localStorage.setItem('lx_companion_last_dialog', full.slice(0, 400));
          } catch (_) {}
        }
      } catch (e) {
        const err = '网络好像打了个盹，稍后再试一下吧～';
        body.innerHTML = esc(err);
        history.push({ role: 'assistant', content: err });
      }
      chat.scrollTop = chat.scrollHeight;
    }

    async function analyzeEmotion() {
      if (!(await checkAuth())) return;
      openModal('modalEmotion');
      document.getElementById('emotionTip').textContent = '分析中...';
      const text = history.filter(m => m.role === 'user').map(m => m.content).join(' ') || '暂无对话';

      try {
        const r = await fetch('/api/deepseek/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          cache: 'no-store',
          body: JSON.stringify({
            skip_persist: true,
            messages: [
              { role: 'system', content: '输出JSON，键为 happy,sad,angry,calm,surprised,fear，值0-1。只返回JSON。' },
              { role: 'user', content: '分析以下对话的情绪，输出JSON：' + text.slice(0, 500) }
            ],
            max_tokens: 200,
            stream: false
          })
        });
        const data = await r.json().catch(() => ({}));
        if (r.status === 401) {
          location.href = '/login';
          return;
        }
        const raw = data?.choices?.[0]?.message?.content || data?.content || '';
        let emo = { happy: 0.3, sad: 0.2, angry: 0.1, calm: 0.4, surprised: 0.2, fear: 0.1 };
        try {
          const j = JSON.parse(raw.replace(/```\w*\n?|\n?```/g, '').trim());
          if (j && typeof j === 'object') emo = { ...emo, ...j };
        } catch (_) {}

        const names = { happy: '开心', sad: '悲伤', angry: '愤怒', calm: '平静', surprised: '惊讶', fear: '恐惧' };
        const vals = Object.entries(emo).map(([k, v]) => ({
          name: names[k] || k,
          value: Math.min(1, Math.max(0, Number(v) || 0))
        }));

        const el = document.getElementById('radarChart');
        if (radarChart) radarChart.dispose();
        radarChart = echarts.init(el);
        radarChart.setOption({
          radar: {
            indicator: vals.map(v => ({ name: v.name, max: 1 })),
            shape: 'polygon',
            splitArea: { areaStyle: { color: ['rgba(125,164,141,0.08)', 'rgba(125,164,141,0.03)'] } },
            axisLine: { lineStyle: { color: 'rgba(125,164,141,0.35)' } },
            splitLine: { lineStyle: { color: 'rgba(125,164,141,0.22)' } }
          },
          series: [{
            type: 'radar',
            data: [{
              value: vals.map(v => v.value),
              areaStyle: { color: 'rgba(125,164,141,0.28)' },
              lineStyle: { color: '#7da48d', width: 2 }
            }]
          }]
        });

        document.getElementById('emotionTip').textContent = '以上为基于本次对话的情绪分析，仅供参考，愿你心情平和～';
      } catch (e) {
        document.getElementById('emotionTip').textContent = '分析失败，请稍后重试。';
      }
    }

    function initDiary() {
      document.getElementById('diaryText').value = localStorage.getItem('lx_diary') || '';
    }

    function saveDiary() {
      const t = document.getElementById('diaryText').value;
      localStorage.setItem('lx_diary', t);
      updateCalendarFromText(t);
      closeModal('modalDiary');
    }

    const MOOD_KEYS = ['开心', '平静', '焦虑', '难过', '愤怒', '期待', '疲惫'];

    function localDateStr(d = new Date()) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function updateCalendarFromText(text) {
      const found = MOOD_KEYS.find(k => text.includes(k)) || '平静';
      const key = 'lx_companion_cal';
      let arr = [];
      try {
        arr = JSON.parse(localStorage.getItem(key) || '[]');
        if (!Array.isArray(arr)) arr = [];
      } catch (_) { arr = []; }
      const day = localDateStr();
      const i = arr.findIndex(x => x.d === day);
      if (i >= 0) arr[i].m = found;
      else { arr.push({ d: day, m: found }); arr = arr.slice(-14); }
      localStorage.setItem(key, JSON.stringify(arr));
    }

    function initCalendar() {
      const grid = document.getElementById('calendarGrid');
      let arr = [];
      try {
        arr = JSON.parse(localStorage.getItem('lx_companion_cal') || '[]');
        if (!Array.isArray(arr)) arr = [];
      } catch (_) { arr = []; }
      const map = Object.fromEntries(arr.map(x => [x.d, x.m]));
      const today = new Date();
      grid.innerHTML = Array.from({ length: 7 }, (_, i) => {
        const dt = new Date(today);
        dt.setDate(today.getDate() - (6 - i));
        const y = dt.getFullYear();
        const m = String(dt.getMonth() + 1).padStart(2, '0');
        const d = String(dt.getDate()).padStart(2, '0');
        const ds = `${y}-${m}-${d}`;
        const mood = map[ds] || '—';
        const label = `${dt.getMonth() + 1}/${dt.getDate()}`;
        return `<div class="cal-day"><span>${label}</span>${mood}</div>`;
      }).join('');
    }

    function openModal(id) {
      document.getElementById(id).classList.add('show');
    }
    function closeModal(id) {
      document.getElementById(id).classList.remove('show');
    }

    function setNavChatActive() {
      document.querySelectorAll('.nav-item[data-action]').forEach(n => n.classList.remove('active'));
      document.getElementById('navChat').classList.add('active');
    }

    function closeMobileSidebar() {
      sidebar.classList.remove('open');
      sidebarBackdrop.classList.remove('show');
    }

    menuToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarBackdrop.classList.toggle('show', sidebar.classList.contains('open'));
    });
    sidebarBackdrop.addEventListener('click', closeMobileSidebar);

    document.getElementById('navChat').addEventListener('click', () => {
      setNavChatActive();
      closeMobileSidebar();
    });

    document.querySelectorAll('.nav-item[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-item[data-view]').forEach(n => n.classList.remove('active'));
        document.querySelectorAll('.nav-item[data-action]').forEach(n => n.classList.remove('active'));
        btn.classList.add('active');
        const act = btn.dataset.action;
        if (act === 'emotion') analyzeEmotion();
        if (act === 'diary') { initDiary(); openModal('modalDiary'); }
        if (act === 'calendar') { initCalendar(); openModal('modalCalendar'); }
        closeMobileSidebar();
      });
    });

    document.querySelectorAll('[data-close]').forEach(btn => {
      btn.addEventListener('click', () => {
        closeModal(btn.dataset.close);
        setNavChatActive();
      });
    });

    document.getElementById('saveDiary').onclick = saveDiary;

    document.getElementById('btnLogout').onclick = async () => {
      try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'include', cache: 'no-store' }); } catch (_) {}
      location.href = '/login';
    };

    document.getElementById('btnClearChat').onclick = async () => {
      if (!confirm('要清空当前对话吗？将删除服务器上本会话记录，并开启新会话。')) return;
      try {
        if (currentSessionId) {
          await fetch('/api/users/me/messages?session_id=' + encodeURIComponent(currentSessionId), {
            method: 'DELETE',
            credentials: 'include',
            cache: 'no-store'
          });
        }
      } catch (_) {}
      currentSessionId = newCompanionId();
      localStorage.setItem(LS_COMPANION_SID, currentSessionId);
      history = [];
      chat.innerHTML = '';
      const welcome = '你好呀～ 我是聆心小开，有什么想聊的吗？我在这里陪你。';
      addMsg(welcome, 'assistant');
      history.push({ role: 'assistant', content: welcome });
    };

    document.getElementById('userProfile').onclick = () => { location.href = '/profile'; };

    sendBtn.onclick = () => {
      const t = input.value.trim();
      if (t) {
        input.value = '';
        sendBtn.disabled = true;
        streamChat(t).finally(() => { sendBtn.disabled = false; });
      }
    };
    input.onkeydown = e => { if (e.key === 'Enter') sendBtn.click(); };

    (async () => {
      if (!(await checkAuth())) return;
      sendBtn.disabled = false;
      currentSessionId = loadOrCreateSessionId();
      await hydrateCompanionHistory();
      if (history.length === 0) {
        const welcome = '你好呀～ 我是聆心小开，有什么想聊的吗？我在这里陪你。';
        addMsg(welcome, 'assistant');
        history.push({ role: 'assistant', content: welcome });
      }
    })();
  </script>
</body>
