<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聆心小开 - 解惑助手 (全屏版)</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    :root {
      --bg-start: #EBF2ED;
      --bg-end: #F8FBF9;
      --text-main: #3A4A41;
      --text-sub: #7A8F83;
      --accent-color: #7DA48D;
      --accent-hover: #658A74;
      --accent-light: #DCE8E1;
      --glass-bg: rgba(255, 255, 255, 0.55);
      --glass-border: rgba(255, 255, 255, 0.8);
      --shadow: rgba(74, 93, 82, 0.06);
    }

    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
      font-family: 'PingFang SC', 'Noto Sans SC', -apple-system, sans-serif;
      color: var(--text-main);
      background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
    }

    #canvas-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
    }

    .app-layout {
      position: relative; z-index: 10;
      display: flex; width: 100%; height: 100%;
      background: transparent;
    }

    .sidebar {
      width: 260px; height: 100%;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border-right: 1px solid var(--glass-border);
      display: flex; flex-direction: column;
      padding: 24px 16px;
      box-shadow: 4px 0 24px rgba(0,0,0,0.02);
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .sidebar-brand {
      display: flex; align-items: center; gap: 12px;
      padding: 0 10px 24px 10px;
    }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
      color: white; display: flex; align-items: center; justify-content: center;
      font-size: 18px; box-shadow: 0 4px 12px rgba(125,164,141,0.4);
    }
    .brand-text { font-size: 18px; font-weight: 600; letter-spacing: 1px; color: var(--text-main); }

    .nav-title {
      font-size: 12px; color: var(--text-sub); margin: 10px 10px; font-weight: 500;
      letter-spacing: 1px; text-transform: uppercase;
    }

    .nav-menu { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }

    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-radius: 16px; cursor: pointer;
      color: var(--text-main); text-decoration: none; font-size: 15px; font-weight: 500;
      transition: all 0.3s ease; border: 1px solid transparent;
      background: none; width: 100%; text-align: left; font-family: inherit;
      -webkit-tap-highlight-color: rgba(125,164,141,0.2);
    }
    .nav-item i { font-size: 16px; width: 20px; text-align: center; color: var(--text-sub); transition: 0.3s; }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.7);
      border-color: var(--glass-border);
      transform: translateX(4px); box-shadow: 0 4px 12px var(--shadow);
    }
    .nav-item:hover i { color: var(--accent-color); }

    .nav-item.active {
      background: rgba(255, 255, 255, 0.9);
      color: var(--accent-color);
      border-color: var(--glass-border);
      box-shadow: 0 6px 16px rgba(125,164,141,0.15);
    }
    .nav-item.active i { color: var(--accent-color); }

    .recent-scroll {
      flex: none;
      max-height: 140px;
      overflow-y: auto;
      margin-bottom: 12px;
    }
    .recent-scroll::-webkit-scrollbar { width: 4px; }
    .recent-scroll::-webkit-scrollbar-thumb { background: rgba(125,164,141,0.3); border-radius: 2px; }

    .recent-item {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 12px; border-radius: 12px; font-size: 13px;
      cursor: pointer; border: 1px solid transparent; margin-bottom: 4px;
      color: var(--text-main); background: rgba(255,255,255,0.35);
    }
    .recent-item:hover { border-color: var(--glass-border); background: rgba(255,255,255,0.65); }
    .recent-item.active { border-color: var(--accent-color); color: var(--accent-color); }
    .recent-item span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .recent-del {
      opacity: 0.5; border: none; background: none; cursor: pointer; color: inherit; padding: 4px;
      border-radius: 8px;
    }
    .recent-del:hover { opacity: 1; background: rgba(125,164,141,0.15); }

    .user-profile {
      margin-top: auto; display: flex; align-items: center; gap: 12px;
      padding: 12px; background: rgba(255,255,255,0.5); border-radius: 16px;
      border: 1px solid var(--glass-border); cursor: pointer; transition: 0.3s;
    }
    .user-profile:hover { background: rgba(255,255,255,0.8); box-shadow: 0 4px 12px var(--shadow); }
    .user-avatar { width: 36px; height: 36px; border-radius: 10px; background: var(--accent-light); overflow: hidden; flex-shrink: 0; }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-status { font-size: 11px; color: var(--text-sub); display: flex; align-items: center; gap: 4px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #4CAF50; }

    .chat-main {
      flex: 1; height: 100%; display: flex; flex-direction: column;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      position: relative; min-width: 0;
    }

    .top-header {
      height: 64px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; border-bottom: 1px solid rgba(255,255,255,0.4);
      background: linear-gradient(to bottom, rgba(255,255,255,0.5) 0%, transparent 100%);
    }
    .header-title { font-size: 16px; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .header-actions button {
      background: rgba(255,255,255,0.6); border: 1px solid var(--glass-border);
      width: 36px; height: 36px; border-radius: 50%; color: var(--text-sub);
      cursor: pointer; transition: 0.3s; box-shadow: 0 2px 8px var(--shadow);
    }
    .header-actions button:hover { background: #fff; color: var(--accent-color); transform: translateY(-2px); }

    .chat-area {
      flex: 1; overflow-y: auto; padding: 30px 12%;
      scroll-behavior: smooth;
    }
    .chat-area::-webkit-scrollbar { width: 6px; }
    .chat-area::-webkit-scrollbar-thumb { background: rgba(125,164,141,0.25); border-radius: 3px; }

    .msg { display: flex; margin-bottom: 28px; align-items: flex-end; animation: msgIn 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); }
    @keyframes msgIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .msg.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 40px; height: 40px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 18px; margin: 0 16px;
      box-shadow: 0 4px 15px var(--shadow); border: 2px solid #fff;
    }
    .msg.assistant .msg-avatar { background: rgba(255,255,255,0.9); color: var(--accent-color); }
    .msg.user .msg-avatar { background: linear-gradient(135deg, var(--accent-hover), var(--accent-color)); color: #fff; }

    .msg-content-wrap { display: flex; flex-direction: column; max-width: 75%; }
    .msg.user .msg-content-wrap { align-items: flex-end; }
    .msg.assistant .msg-content-wrap { align-items: flex-start; }

    .msg-body {
      padding: 16px 22px; font-size: 15px; line-height: 1.6; word-wrap: break-word;
      transition: transform 0.2s ease;
    }
    .msg-body:hover { transform: translateY(-2px); }

    .msg.user .msg-body {
      background: linear-gradient(135deg, var(--accent-hover), var(--accent-color));
      color: #fff; border-radius: 20px 20px 4px 20px;
      box-shadow: 0 8px 25px rgba(125, 164, 141, 0.25);
    }
    .msg.assistant .msg-body {
      background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      color: var(--text-main); border-radius: 20px 20px 20px 4px;
      border: 1px solid var(--glass-border); box-shadow: 0 8px 30px var(--shadow);
    }

    .msg-body p { margin: 0 0 10px 0; }
    .msg-body p:last-child { margin: 0; }
    .msg.assistant .msg-body strong { color: #2A3830; }

    .msg-time { font-size: 11px; color: var(--text-sub); margin-top: 6px; padding: 0 4px; }

    .input-wrap {
      flex-shrink: 0; padding: 20px 10%;
      background: linear-gradient(to top, rgba(235,242,237,0.9) 0%, transparent 100%);
      z-index: 20;
    }
    .input-row {
      display: flex; gap: 12px; align-items: center;
      background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(25px);
      padding: 10px 12px 10px 24px; border-radius: 30px;
      box-shadow: 0 10px 30px var(--shadow); border: 1px solid var(--glass-border);
      transition: all 0.3s ease;
    }
    .input-row:focus-within { background: #fff; box-shadow: 0 15px 40px rgba(125, 164, 141, 0.15); border-color: var(--accent-color); }

    .input-row input {
      flex: 1; border: none; padding: 12px 0; font-size: 15px;
      background: transparent; outline: none; color: var(--text-main);
    }
    .input-row input::placeholder { color: #a6b3ac; }

    .input-row button {
      width: 48px; height: 48px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, var(--accent-hover), var(--accent-color));
      color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 18px; box-shadow: 0 4px 15px rgba(125,164,141,0.3); transition: all 0.3s ease; flex-shrink: 0;
    }
    .input-row button:hover:not(:disabled) { transform: translateY(-2px) scale(1.05); box-shadow: 0 8px 20px rgba(125,164,141,0.4); }
    .input-row button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .typing { display: flex; align-items: center; gap: 5px; padding: 8px 4px; }
    .typing span { width: 6px; height: 6px; background-color: var(--accent-color); border-radius: 50%; animation: typing-bounce 1.4s infinite ease-in-out both; }
    .typing span:nth-child(1) { animation-delay: -0.32s; }
    .typing span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typing-bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

    .menu-toggle { display: none; background: none; border: none; font-size: 20px; color: var(--text-main); cursor: pointer; }

    .sidebar-backdrop {
      display: none; position: fixed; inset: 0; z-index: 100; background: rgba(58,74,65,0.2);
    }
    .sidebar-backdrop.show { display: block; }
    @media (max-width: 768px) {
      .sidebar-backdrop.show { left: 260px; }
    }

    .modal {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(58,74,65,0.28); backdrop-filter: blur(8px);
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal.show { display: flex; }
    .modal-box {
      background: var(--glass-bg); backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border); border-radius: 24px;
      padding: 24px; max-width: 440px; width: 100%; max-height: 85vh; overflow-y: auto;
      box-shadow: 0 24px 60px var(--shadow);
    }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-head h2 { margin: 0; font-size: 1.1rem; color: var(--text-main); }
    .modal-close {
      border: none; background: rgba(255,255,255,0.6); width: 36px; height: 36px; border-radius: 50%;
      cursor: pointer; color: var(--text-sub); font-size: 1.2rem;
    }
    .modal-close:hover { color: var(--accent-color); background: #fff; }

    #spectrumChart { width: 100%; height: 280px; }
    .modal-tip { font-size: 0.88rem; color: var(--text-sub); margin-top: 12px; line-height: 1.5; }

    .diary-textarea {
      width: 100%; min-height: 140px; padding: 14px; border-radius: 16px;
      border: 1px solid var(--glass-border); font-family: inherit; font-size: 0.95rem;
      resize: vertical; background: rgba(255,255,255,0.7);
    }
    .diary-textarea:focus { outline: none; border-color: var(--accent-color); }
    .btn-primary {
      margin-top: 14px; padding: 12px 22px; border-radius: 22px; border: none;
      background: linear-gradient(135deg, var(--accent-hover), var(--accent-color));
      color: #fff; font-size: 0.95rem; cursor: pointer; font-weight: 500;
      box-shadow: 0 4px 14px rgba(125,164,141,0.3);
    }
    .btn-primary:hover { transform: translateY(-1px); }

    .med-wrap { text-align: center; padding: 8px 0; }
    .med-circle {
      width: 160px; height: 160px; margin: 24px auto; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-light), rgba(255,255,255,0.9));
      border: 2px solid var(--glass-border);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.05rem; font-weight: 600; color: var(--accent-color);
      transition: transform 4s ease-in-out;
      box-shadow: 0 12px 40px rgba(125,164,141,0.2);
    }
    .med-circle.inhale { transform: scale(1.18); }
    .med-circle.hold { transform: scale(1.18); }
    .med-circle.exhale { transform: scale(0.92); }
    .med-phase { font-size: 0.95rem; color: var(--text-sub); min-height: 1.5em; }
    .med-btns { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
    .med-btns button {
      padding: 10px 18px; border-radius: 20px; border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.7); cursor: pointer; font-family: inherit; color: var(--text-main);
    }
    .med-btns button.primary { background: linear-gradient(135deg, var(--accent-hover), var(--accent-color)); color: #fff; border: none; }

    @media (max-width: 900px) {
      .chat-area { padding: 20px 5%; }
      .input-wrap { padding: 15px 5%; }
    }

    @media (min-width: 769px) {
      .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 101; }
      .app-layout { margin-left: 260px; }
    }

    @media (max-width: 768px) {
      .menu-toggle { display: block; }
      .sidebar { position: fixed; left: -260px; top: 0; bottom: 0; z-index: 101; touch-action: manipulation; pointer-events: auto; transition: left 0.3s ease; }
      .sidebar.open { left: 0; }
      .nav-item { touch-action: manipulation; min-height: 48px; position: relative; z-index: 2; pointer-events: auto; }
      .nav-item:hover { transform: none; }
      .user-profile { min-height: 48px; pointer-events: auto; }
      .recent-item { min-height: 44px; pointer-events: auto; }
      .msg-content-wrap { max-width: 85%; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon"><i class="fa-solid fa-leaf"></i></div>
      <div class="brand-text">聆心小开</div>
    </div>

    <div class="nav-title">特色功能</div>
    <nav class="nav-menu" style="flex:none;">
      <button type="button" class="nav-item active" data-view="chat" id="navChat"><i class="fa-solid fa-spa"></i> 解惑树洞</button>
      <button type="button" class="nav-item" data-action="spectrum"><i class="fa-solid fa-chart-pie"></i> 情绪光谱</button>
      <button type="button" class="nav-item" data-action="meditate"><i class="fa-solid fa-wind"></i> 氧气冥想</button>
      <button type="button" class="nav-item" data-action="diary"><i class="fa-solid fa-book-open"></i> 心灵日记</button>
      <a class="nav-item" href="/" id="navHome"><i class="fa-solid fa-house"></i> 返回首页</a>
    </nav>

    <div class="nav-title" style="margin-top: 16px;">最近记录</div>
    <div class="recent-scroll" id="recentList"></div>
    <button type="button" class="nav-item" id="btnNewSession" style="margin-bottom: 12px; font-size: 13px;">
      <i class="fa-solid fa-plus"></i> 新建对话
    </button>

    <div class="user-profile" id="userProfile" title="账号">
      <div class="user-avatar"><img id="userAvatarImg" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt=""></div>
      <div class="user-info">
        <div class="user-name" id="userDisplayName">旅人</div>
        <div class="user-status"><span class="status-dot"></span> <span id="userStatusText">正在学习</span></div>
      </div>
    </div>
  </aside>

  <div class="app-layout">
    <main class="chat-main">
      <header class="top-header">
        <div class="header-title">
          <button type="button" class="menu-toggle" id="menuToggle" aria-label="菜单"><i class="fa-solid fa-bars"></i></button>
          <span>AI 解惑助手</span>
        </div>
        <div class="header-actions">
          <button type="button" title="清空当前对话" id="btnClearChat"><i class="fa-solid fa-broom"></i></button>
        </div>
      </header>

      <div class="chat-area" id="chat"></div>

      <div class="input-wrap">
        <div class="input-row">
          <input type="text" id="input" placeholder="输入你的问题，让春风为你解答..." autocomplete="off">
          <button id="send" type="button" disabled><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>
    </main>
  </div>

  <div class="modal" id="modalSpectrum" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head">
        <h2>情绪光谱</h2>
        <button type="button" class="modal-close" data-close="modalSpectrum">&times;</button>
      </div>
      <div id="spectrumChart"></div>
      <p class="modal-tip" id="spectrumTip">基于当前对话内容的情绪分布估算，仅供参考。</p>
    </div>
  </div>

  <div class="modal" id="modalDiary" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head">
        <h2>心灵日记</h2>
        <button type="button" class="modal-close" data-close="modalDiary">&times;</button>
      </div>
      <textarea class="diary-textarea" id="diaryText" placeholder="记录今日心情、困惑或小小进步..."></textarea>
      <button type="button" class="btn-primary" id="saveDiary">保存到本地</button>
    </div>
  </div>

  <div class="modal" id="modalMeditate" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head">
        <h2>氧气冥想</h2>
        <button type="button" class="modal-close" data-close="modalMeditate">&times;</button>
      </div>
      <p class="modal-tip" style="margin-top:0;">4-4-6 呼吸：吸气 4 秒 · 屏息 4 秒 · 呼气 6 秒，循环放松。</p>
      <div class="med-wrap">
        <div class="med-circle" id="medCircle">准备</div>
        <div class="med-phase" id="medPhase">点击开始，找一个舒服的姿势</div>
        <div class="med-btns">
          <button type="button" class="primary" id="medStart">开始</button>
          <button type="button" id="medStop">停止</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let globalWindSpeed = 1.0;

    const initBackground = () => {
      const container = document.getElementById('canvas-container');
      if (typeof THREE === 'undefined') return;
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2('#EBF2ED', 0.006);

      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 60;

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      const createTexture = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 32; canvas.height = 32;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
        grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
        grad.addColorStop(0.4, 'rgba(255, 255, 255, 0.6)');
        grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(16, 16, 16, 0, Math.PI * 2); ctx.fill();
        return new THREE.CanvasTexture(canvas);
      };

      const particleCount = 450;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(particleCount * 3);
      const velocities = [];

      for (let i = 0; i < particleCount; i++) {
        pos[i * 3] = (Math.random() - 0.5) * 150;
        pos[i * 3 + 1] = (Math.random() - 0.5) * 100;
        pos[i * 3 + 2] = (Math.random() - 0.5) * 80;
        velocities.push({
          x: (Math.random() - 0.5) * 0.02,
          y: Math.random() * 0.03 + 0.01
        });
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

      const mat = new THREE.PointsMaterial({
        size: 1.2, color: 0x7DA48D, map: createTexture(),
        transparent: true, opacity: 0.6, depthWrite: false, blending: THREE.AdditiveBlending
      });
      const particles = new THREE.Points(geo, mat);
      scene.add(particles);

      let targetRotX = 0, targetRotY = 0;
      document.addEventListener('mousemove', (e) => {
        targetRotY = ((e.clientX / window.innerWidth) * 2 - 1) * 0.05;
        targetRotX = ((e.clientY / window.innerHeight) * 2 - 1) * 0.05;
      });

      let time = 0;
      const animate = () => {
        requestAnimationFrame(animate);
        time += 0.002;
        camera.position.x += (targetRotY * 20 - camera.position.x) * 0.05;
        camera.position.y += (-targetRotX * 20 - camera.position.y) * 0.05;
        camera.lookAt(scene.position);

        const positions = geo.attributes.position.array;
        for (let i = 0; i < particleCount; i++) {
          const v = velocities[i];
          positions[i * 3] += v.x * globalWindSpeed + Math.sin(time * 3 + positions[i * 3 + 1] * 0.05) * 0.02 * globalWindSpeed;
          positions[i * 3 + 1] += v.y * globalWindSpeed;
          if (positions[i * 3 + 1] > 60) positions[i * 3 + 1] = -60;
        }
        geo.attributes.position.needsUpdate = true;
        if (globalWindSpeed > 1.0) globalWindSpeed += (1.0 - globalWindSpeed) * 0.02;
        renderer.render(scene, camera);
      };
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    };
    initBackground();

    const STORAGE_DIARY = 'lx_popsci_diary';
    const SYS = `你是"聆心小开"，像朋友一样聊天：先共情对方感受，语气自然、温暖。全文不超过50字；少讲理论、不堆砌概念名词、不重复说教。不作医学诊断。若谈及自杀或自残，先表达关心并建议向身边人或专业援助求助。`;
    const MAX_HIST = 16;

    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    const sidebarBackdrop = document.getElementById('sidebarBackdrop');

    let history = [];
    let sessions = [];
    let currentSessionId = null;
    let spectrumChart = null;
    let medTimer = null;
    let medRunning = false;

    async function checkAuth() {
      const r = await fetch('/api/users/me', { credentials: 'include', cache: 'no-store' });
      if (!r.ok) { location.href = '/login'; return false; }
      try {
        const data = await r.json();
        const u = data.user || data;
        const name = u.nickname || u.username || u.name || '旅人';
        document.getElementById('userDisplayName').textContent = name;
        const seed = encodeURIComponent(String(u.id || name));
        document.getElementById('userAvatarImg').src = 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + seed;
      } catch (_) {}
      return true;
    }

    function groupMessagesToSessions(messages) {
      const groups = new Map();
      for (const m of messages) {
        const sid = m.session_id != null && m.session_id !== '' ? m.session_id : 'legacy';
        /* 与心理陪伴隔离：仅展示本模块 popsci- 会话，不把 companion-/user- 等混入「最近记录」 */
        if (!String(sid).startsWith('popsci-')) continue;
        if (!groups.has(sid)) groups.set(sid, []);
        groups.get(sid).push(m);
      }
      const out = [];
      for (const [id, msgs] of groups) {
        msgs.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
        const hist = [];
        for (const m of msgs) {
          if (m.role === 'user' || m.role === 'assistant')
            hist.push({ role: m.role, content: m.content });
        }
        const firstUser = msgs.find(m => m.role === 'user');
        const raw = firstUser?.content || '对话';
        const title = raw.slice(0, 18) + (raw.length >= 18 ? '…' : '');
        const updated = Math.max(...msgs.map(m => new Date(m.created_at).getTime()));
        out.push({ id, title, history: hist, updated });
      }
      out.sort((a, b) => b.updated - a.updated);
      return out;
    }

    async function loadSessionsFromServer() {
      try {
        const r = await fetch('/api/users/me/messages?limit=2000', { credentials: 'include', cache: 'no-store' });
        if (!r.ok) return;
        const data = await r.json();
        sessions = groupMessagesToSessions(data.messages || []);
        renderRecent();
      } catch (_) {}
    }

    function persistCurrentSession() {
      if (!currentSessionId) return;
      const idx = sessions.findIndex(s => s.id === currentSessionId);
      const base = history.find(m => m.role === 'user')?.content?.slice(0, 18) || '新对话';
      const entry = {
        id: currentSessionId,
        title: base + (base.length >= 18 ? '…' : ''),
        history: history.slice(),
        updated: Date.now()
      };
      if (idx >= 0) sessions[idx] = entry;
      else sessions.unshift(entry);
      sessions.sort((a, b) => b.updated - a.updated);
      renderRecent();
    }

    function renderRecent() {
      const el = document.getElementById('recentList');
      el.innerHTML = sessions.slice(0, 12).map(s => `
        <div class="recent-item ${s.id === currentSessionId ? 'active' : ''}" data-id="${s.id}">
          <span title="${escAttr(s.title)}">${esc(s.title)}</span>
          <button type="button" class="recent-del" data-del="${s.id}" aria-label="删除"><i class="fa-solid fa-xmark"></i></button>
        </div>
      `).join('');
      el.querySelectorAll('.recent-item').forEach(row => {
        let last = 0;
        const tap = (e) => {
          if (Date.now() - last < 350) return;
          last = Date.now();
          if (e.target.closest('.recent-del')) return;
          switchSession(row.dataset.id);
          closeMobileSidebar();
        };
        row.addEventListener('touchend', (e) => { e.preventDefault(); tap(e); }, { passive: false });
        row.addEventListener('click', tap);
      });
      el.querySelectorAll('.recent-del').forEach(btn => {
        let last = 0;
        const tap = (e) => {
          if (Date.now() - last < 350) return;
          last = Date.now();
          e.stopPropagation();
          deleteSession(btn.dataset.del);
        };
        btn.addEventListener('touchend', (e) => { e.preventDefault(); tap(e); }, { passive: false });
        btn.addEventListener('click', tap);
      });
    }

    function escAttr(s) {
      return String(s || '').replace(/"/g, '&quot;').replace(/</g, '');
    }

    async function deleteSession(id) {
      try {
        const q = id === 'legacy' ? '' : id;
        await fetch('/api/users/me/messages?session_id=' + encodeURIComponent(q), {
          method: 'DELETE',
          credentials: 'include',
          cache: 'no-store'
        });
      } catch (_) {}
      await loadSessionsFromServer();
      if (id === currentSessionId) {
        if (sessions.length) switchSession(sessions[0].id);
        else newSession();
      }
    }

    function switchSession(id) {
      persistCurrentSession();
      const s = sessions.find(x => x.id === id);
      if (!s) return;
      currentSessionId = id;
      history = Array.isArray(s.history) ? s.history.slice() : [];
      renderChatFromHistory();
      renderRecent();
    }

    function newId() {
      return 'popsci-' + (typeof crypto !== 'undefined' && crypto.randomUUID
        ? crypto.randomUUID()
        : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
    }

    function newSession() {
      persistCurrentSession();
      currentSessionId = newId();
      history = [];
      renderWelcome();
      renderRecent();
    }

    function renderWelcome() {
      chat.innerHTML = `
        <div class="msg assistant">
          <div class="msg-avatar"><i class="fa-solid fa-leaf"></i></div>
          <div class="msg-content-wrap">
            <div class="msg-body">你好！我是你的解惑助手。心里有什么打不开的结，或是感到迷茫的地方，都可以随时告诉我。我会用心理学的视角，陪你一起寻找答案 🌱</div>
            <div class="msg-time">刚刚</div>
          </div>
        </div>`;
      chat.scrollTop = chat.scrollHeight;
    }

    function renderChatFromHistory() {
      chat.innerHTML = '';
      if (!history.length) {
        renderWelcome();
        return;
      }
      history.forEach((m, i) => {
        if (m.role === 'user' || m.role === 'assistant') addMsg(m.content, m.role, false, true);
      });
    }

    function getCurrentTime() {
      return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function md(s) {
      if (typeof marked !== 'undefined') {
        try { return marked.parse(s || ''); } catch (e) { return esc(s); }
      }
      return esc(s).replace(/\n/g, '<br>');
    }

    function addMsg(content, role, isLoading, skipPersist) {
      const d = document.createElement('div');
      d.className = 'msg ' + role;
      if (isLoading) {
        d.innerHTML = `
          <div class="msg-avatar"><i class="fa-solid fa-leaf"></i></div>
          <div class="msg-content-wrap">
            <div class="msg-body"><div class="typing"><span></span><span></span><span></span></div></div>
          </div>`;
      } else {
        d.innerHTML = `
          <div class="msg-avatar"><i class="fa-solid fa-${role === 'user' ? 'user' : 'leaf'}"></i></div>
          <div class="msg-content-wrap">
            <div class="msg-body">${role === 'assistant' ? md(content) : esc(content).replace(/\n/g, '<br>')}</div>
            <div class="msg-time">${getCurrentTime()}</div>
          </div>`;
      }
      chat.appendChild(d);
      setTimeout(() => chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' }), 50);
      if (!skipPersist && !isLoading) persistCurrentSession();
      return d;
    }

    function pickAssistantText(data) {
      if (!data || typeof data !== 'object') return '';
      const msg = data.choices?.[0]?.message;
      if (msg && typeof msg === 'object') {
        const c = msg.content;
        if (typeof c === 'string' && c.trim()) return c.trim();
        const r = msg.reasoning_content;
        if (typeof r === 'string' && r.trim()) return r.trim();
      }
      if (typeof data.content === 'string' && data.content.trim()) return data.content.trim();
      return '';
    }

    function pickApiError(data) {
      if (!data || typeof data !== 'object') return '';
      if (typeof data.message === 'string' && data.message) return data.message;
      const e = data.error;
      if (typeof e === 'string') return e;
      if (e && typeof e === 'object' && typeof e.message === 'string') return e.message;
      return '';
    }

    async function sendMsg() {
      if (!(await checkAuth())) return;
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      sendBtn.disabled = true;
      globalWindSpeed = 10.0;

      history.push({ role: 'user', content: text });
      addMsg(text, 'user');

      const loadingNode = addMsg('', 'assistant', true);

      try {
        const r = await fetch('/api/deepseek/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          cache: 'no-store',
          body: JSON.stringify({
            session_id: currentSessionId,
            messages: [{ role: 'system', content: SYS }, ...history.slice(-MAX_HIST)],
            max_tokens: 512,
            temperature: 0.7,
            stream: false
          })
        });
        const data = await r.json().catch(() => ({}));
        loadingNode.remove();

        if (r.status === 401) {
          const msg401 = '登录已过期，请重新登录后再试。';
          history.push({ role: 'assistant', content: msg401 });
          addMsg(msg401, 'assistant');
          setTimeout(() => { location.href = '/login'; }, 800);
          return;
        }

        if (!r.ok) {
          const err = pickApiError(data) || `服务暂时不可用（${r.status}）`;
          history.push({ role: 'assistant', content: err });
          addMsg(err, 'assistant');
          return;
        }

        let reply = pickAssistantText(data);
        if (!reply) {
          const err = pickApiError(data);
          reply = err || '未收到模型回复，请检查 DEEPSEEK_API_KEY 或稍后再试。';
        }
        history.push({ role: 'assistant', content: reply });
        addMsg(reply, 'assistant');
      } catch (e) {
        loadingNode.remove();
        const err = '网络好像打了个盹，稍后再试一下吧～';
        history.push({ role: 'assistant', content: err });
        addMsg(err, 'assistant');
      } finally {
        sendBtn.disabled = false;
        input.focus();
        persistCurrentSession();
        loadSessionsFromServer();
      }
    }

    function openModal(id) {
      document.getElementById(id).classList.add('show');
    }
    function closeModal(id) {
      document.getElementById(id).classList.remove('show');
    }

    async function openSpectrum() {
      if (!(await checkAuth())) return;
      openModal('modalSpectrum');
      document.getElementById('spectrumTip').textContent = '分析中...';
      const text = history.filter(m => m.role === 'user').map(m => m.content).join(' ') || '暂无对话内容';
      try {
        const r = await fetch('/api/deepseek/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          cache: 'no-store',
          body: JSON.stringify({
            skip_persist: true,
            messages: [
              { role: 'system', content: '输出JSON，键为 happy,sad,angry,calm,surprised,fear，值0-1。只返回JSON。' },
              { role: 'user', content: '分析以下文字的情绪倾向，输出JSON：' + text.slice(0, 500) }
            ],
            max_tokens: 200,
            stream: false
          })
        });
        const data = await r.json().catch(() => ({}));
        if (r.status === 401) {
          location.href = '/login';
          return;
        }
        const raw = data?.choices?.[0]?.message?.content || data?.content || '';
        let emo = { happy: 0.3, sad: 0.2, angry: 0.1, calm: 0.4, surprised: 0.15, fear: 0.1 };
        try {
          const j = JSON.parse(raw.replace(/```\w*\n?|\n?```/g, '').trim());
          if (j && typeof j === 'object') emo = { ...emo, ...j };
        } catch (_) {}

        const names = { happy: '愉悦', sad: '低落', angry: '烦躁', calm: '平静', surprised: '惊讶', fear: '不安' };
        const vals = Object.entries(emo).map(([k, v]) => ({
          name: names[k] || k,
          value: Math.round(Math.min(1, Math.max(0, Number(v) || 0)) * 100)
        }));

        const chartEl = document.getElementById('spectrumChart');
        if (spectrumChart) spectrumChart.dispose();
        spectrumChart = echarts.init(chartEl);
        spectrumChart.setOption({
          tooltip: { trigger: 'item' },
          series: [{
            type: 'pie',
            radius: ['42%', '68%'],
            avoidLabelOverlap: true,
            itemStyle: { borderRadius: 8, borderColor: '#fff', borderWidth: 2 },
            label: { color: '#3A4A41' },
            data: vals.map(v => ({ name: v.name, value: v.value }))
          }],
          color: ['#7DA48D', '#9BB8A8', '#B8CFC4', '#658A74', '#A8C4B4', '#DCE8E1']
        });
        document.getElementById('spectrumTip').textContent = '以上为基于当前对话的情绪光谱，仅供自我觉察参考。';
      } catch (e) {
        document.getElementById('spectrumTip').textContent = '分析失败，请稍后重试。';
      }
    }

    function stopMeditation() {
      medRunning = false;
      if (medTimer) { clearTimeout(medTimer); medTimer = null; }
      const c = document.getElementById('medCircle');
      c.className = 'med-circle';
      c.textContent = '准备';
      document.getElementById('medPhase').textContent = '已停止。需要时再点开始。';
    }

    function runMeditationStep(phase, ms, next) {
      const c = document.getElementById('medCircle');
      const p = document.getElementById('medPhase');
      c.className = 'med-circle ' + (phase === 'inhale' ? 'inhale' : phase === 'hold' ? 'hold' : 'exhale');
      if (phase === 'inhale') { c.textContent = '吸气'; p.textContent = '慢慢用鼻子吸气，感受腹部隆起…'; }
      else if (phase === 'hold') { c.textContent = '屏息'; p.textContent = '轻轻屏住呼吸，保持平静…'; }
      else { c.textContent = '呼气'; p.textContent = '缓缓呼气，像春风带走紧绷…'; }
      medTimer = setTimeout(() => { if (medRunning) next(); }, ms);
    }

    function meditationLoop() {
      if (!medRunning) return;
      runMeditationStep('inhale', 4000, () => {
        if (!medRunning) return;
        runMeditationStep('hold', 4000, () => {
          if (!medRunning) return;
          runMeditationStep('exhale', 6000, meditationLoop);
        });
      });
    }

    document.getElementById('medStart').onclick = () => {
      if (medRunning) return;
      medRunning = true;
      meditationLoop();
    };
    document.getElementById('medStop').onclick = stopMeditation;

    function setNavActive(view) {
      document.querySelectorAll('.nav-item[data-view]').forEach(n => n.classList.toggle('active', n.dataset.view === view));
    }

    function closeMobileSidebar() {
      sidebar.classList.remove('open');
      sidebarBackdrop.classList.remove('show');
    }

    function mobileTap(el, handler) {
      let last = 0;
      const run = (e) => {
        const now = Date.now();
        if (now - last < 350) return;
        last = now;
        handler(e);
      };
      el.addEventListener('touchend', (e) => { e.preventDefault(); run(e); }, { passive: false });
      el.addEventListener('click', run);
    }

    menuToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarBackdrop.classList.toggle('show', sidebar.classList.contains('open'));
    });
    menuToggle.addEventListener('touchend', (e) => { e.preventDefault(); menuToggle.click(); }, { passive: false });
    sidebarBackdrop.addEventListener('click', closeMobileSidebar);
    sidebarBackdrop.addEventListener('touchend', (e) => { e.preventDefault(); closeMobileSidebar(); }, { passive: false });

    mobileTap(document.getElementById('navChat'), () => {
      setNavActive('chat');
      document.querySelectorAll('.nav-item[data-action]').forEach(n => n.classList.remove('active'));
      closeMobileSidebar();
    });

    mobileTap(document.getElementById('navHome'), (e) => {
      e.preventDefault();
      closeMobileSidebar();
      location.href = '/';
    });

    document.querySelectorAll('.nav-item[data-action]').forEach(btn => {
      mobileTap(btn, () => {
        document.querySelectorAll('.nav-item[data-view]').forEach(n => n.classList.remove('active'));
        btn.classList.add('active');
        const act = btn.dataset.action;
        if (act === 'spectrum') openSpectrum();
        if (act === 'meditate') { stopMeditation(); openModal('modalMeditate'); }
        if (act === 'diary') {
          document.getElementById('diaryText').value = localStorage.getItem(STORAGE_DIARY) || '';
          openModal('modalDiary');
        }
        closeMobileSidebar();
      });
    });

    document.getElementById('saveDiary').onclick = () => {
      localStorage.setItem(STORAGE_DIARY, document.getElementById('diaryText').value);
      closeModal('modalDiary');
      document.getElementById('userStatusText').textContent = '日记已保存';
      setTimeout(() => { document.getElementById('userStatusText').textContent = '正在学习'; }, 2000);
    };

    document.querySelectorAll('[data-close]').forEach(btn => {
      btn.addEventListener('click', () => {
        closeModal(btn.dataset.close);
        if (btn.dataset.close === 'modalMeditate') stopMeditation();
        setNavActive('chat');
        document.getElementById('navChat').classList.add('active');
        document.querySelectorAll('.nav-item[data-action]').forEach(n => n.classList.remove('active'));
      });
    });

    mobileTap(document.getElementById('btnNewSession'), () => {
      newSession();
      setNavActive('chat');
      document.getElementById('navChat').classList.add('active');
      document.querySelectorAll('.nav-item[data-action]').forEach(n => n.classList.remove('active'));
      closeMobileSidebar();
    });

    document.getElementById('btnClearChat').addEventListener('click', async () => {
      if (!confirm('要清空当前对话吗？将删除服务器上本会话的全部消息。')) return;
      const sid = currentSessionId;
      try {
        const q = sid === 'legacy' ? '' : sid;
        await fetch('/api/users/me/messages?session_id=' + encodeURIComponent(q), {
          method: 'DELETE',
          credentials: 'include',
          cache: 'no-store'
        });
      } catch (_) {}
      await loadSessionsFromServer();
      if (sessions.length) switchSession(sessions[0].id);
      else newSession();
    });

    mobileTap(document.getElementById('userProfile'), () => {
      location.href = '/profile';
    });

    sendBtn.onclick = sendMsg;
    input.onkeydown = e => { if (e.key === 'Enter') sendMsg(); };

    (async () => {
      if (!(await checkAuth())) return;
      sendBtn.disabled = false;
      await loadSessionsFromServer();
      if (sessions.length) {
        currentSessionId = sessions[0].id;
        history = Array.isArray(sessions[0].history) ? sessions[0].history.slice() : [];
        renderChatFromHistory();
      } else {
        newSession();
      }
    })();
  </script>
</body>
</html>
